<!doctype html>
<html><head><meta charset="utf-8"><style>

.mark{color:#c9a84c;}

.sub{font-size:22px;color:rgba(245,240,232,0.75);margin-bottom:36px;}

</style></head>
<body>
<div class="wrap">
  <div class="brand"><span class="mark">&#9670;</span> Revenue Sentinel</div>
